<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#1F2937" stroke-width="1" opacity="0.7">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280"/>
    <path d="M160 0 V400 M320 0 V400 M480 0 V400 M640 0 V400 M800 0 V400 M960 0 V400 M1120 0 V400"/>
  </g>

  <!-- left glow bar -->
  <rect x="0" y="0" width="10" height="400" fill="url(#neon)"/>

  <!-- logo mark: stylized X -->
  <g transform="translate(120,110)">
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#0F172A" stroke="#22D3EE" stroke-width="3"/>
    <path d="M40 40 L80 90 L40 140" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 40 L100 90 L140 140" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="90" r="10" fill="#22D3EE"/>
  </g>

  <!-- title -->
  <text x="360" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="700" fill="#F8FAFC">BluedX</text>
  <text x="360" y="215" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#22D3EE">LSPosed Module for Blued</text>
  <text x="360" y="265" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#94A3B8">去广告 · 允许截图 · 隐私增强 · 界面精简</text>

  <!-- chips -->
  <g font-family="Segoe UI, sans-serif" font-size="18">
    <rect x="360" y="300" width="110" height="36" rx="18" fill="#164E63" stroke="#22D3EE" stroke-width="1"/>
    <text x="415" y="323" text-anchor="middle" fill="#A5F3FC">Xposed</text>

    <rect x="485" y="300" width="110" height="36" rx="18" fill="#4C1D95" stroke="#A78BFA" stroke-width="1"/>
    <text x="540" y="323" text-anchor="middle" fill="#DDD6FE">LSPosed</text>

    <rect x="610" y="300" width="110" height="36" rx="18" fill="#14532D" stroke="#4ADE80" stroke-width="1"/>
    <text x="665" y="323" text-anchor="middle" fill="#BBF7D0">MIT</text>
  </g>
</svg>
