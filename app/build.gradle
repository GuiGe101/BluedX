plugins {
    id 'com.android.application'
}

android {
    namespace 'top.zixuan.bluedx'
    compileSdk 34

    defaultConfig {
        applicationId "top.zixuan.bluedx"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        // 用 debug 密钥签名，方便直接安装；正式发布请换成自己的 keystore
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
